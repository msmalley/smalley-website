<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Mark Smalley | Cover Letter | {{ROLE_TITLE}}</title>
<link rel="stylesheet" href="../cv_standard.css">
<link rel="stylesheet" href="../cover-letter-standard.css">
</head>
<body>
<div class="page letter">

  <header class="header">
    <h1>Mark Smalley</h1>
    <div class="role">{{HEADLINE}}</div>
    <div class="contact">
      <span>Halifax, Yorkshire</span>
      <span><a href="mailto:mark@smalley.my">mark@smalley.my</a></span>
      <span>07526 860262</span>
      <span><a href="https://www.linkedin.com/in/msmalley" target="_blank" rel="noopener">linkedin.com/in/msmalley</a></span>
      <span><a href="https://smalley.my" target="_blank" rel="noopener">smalley.my</a></span>
    </div>
  </header>

  <div class="addressee">
    <div class="letter-date">{{DATE}}</div>
    <div class="letter-company">{{COMPANY_NAME}}</div>
    <div class="letter-role">Re: {{ROLE_TITLE}}</div>
  </div>

  <div class="letter-body">
    <p>Dear Hiring Team,</p>
    <p>{{OPENING_HOOK}}</p>
    {{BODY_PARAGRAPHS}}
    <p>{{CLOSING_PARAGRAPH}}</p>
  </div>

  <div class="sign-off">
    <p>Yours sincerely,</p>
    <p class="sign-name">Mark Smalley</p>
  </div>

</div>
</body>
</html>
